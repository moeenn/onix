[package]
name = "onix"
version = "0.1.0"
edition = "2024"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_12"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
rusqlite = { version = "0.40.2", features = ["bundled", "chrono"] }
